services:
  - type: web
    name: qualifresh-backend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      # Image storage: leave unset (= cloudinary) until the GCS bucket exists
      # and the migration script has run, then set to "gcs" in the Render dashboard.
      - key: STORAGE_PROVIDER
        sync: false
      - key: GCS_BUCKET
        sync: false
      - key: GCP_SA_KEY_B64
        sync: false
